<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dynamic-bot WebUI Login</title>
    <script src="/assets/theme.js"></script>
    <link rel="stylesheet" href="/assets/app.css">
</head>
<body class="auth-page">
<main class="auth-shell">
    <section class="card auth-card">
        <p class="eyebrow">dynamic-bot</p>
        <h1>WebUI Login</h1>
        <p class="lead">请先完成本地登录。首次登录后需要立即修改初始密码。</p>

        <form id="login-form" class="stack">
            <label class="field">
                <span>Password</span>
                <input id="login-password" name="password" type="password" autocomplete="current-password">
            </label>
            <button type="submit">Login</button>
        </form>

        <form id="change-password-form" class="stack hidden">
            <label class="field">
                <span>Current Password</span>
                <input id="current-password" name="currentPassword" type="password" autocomplete="current-password">
            </label>
            <label class="field">
                <span>New Password</span>
                <input id="new-password" name="newPassword" type="password" autocomplete="new-password">
            </label>
            <button type="submit">Change Password</button>
        </form>

        <p id="auth-status" class="status-note">Awaiting login...</p>
    </section>
</main>
<script src="/assets/auth.js"></script>
</body>
</html>
