kotlin.code.style=official

# Kotlin 编译 daemon 使用独立 heap，避免干净全量编译受默认 512 MiB 上限影响。
kotlin.daemon.jvmargs=-Xmx1536m

# Gradle 守护进程独立 heap：全量 Kotlin 编译、shadowJar 与 jlink 打包都发生在同一构建中，
# 默认 512 MiB 容易在干净构建时触发 GC 抖动或 OOM；该参数只影响构建期，不进入运行期发行包。
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
