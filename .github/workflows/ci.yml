# 本文件主要工作流程：
# 1. 在主分支提交、PR 和手动触发时启动 CI。
# 2. 准备 JDK 与 Gradle 构建环境。
# 3. 采集环境信息并执行编译、测试、打包。
# 4. 输出摘要并上传诊断文件。
name: CI Build and Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # 超过 10 分钟自动终止任务；GitHub Actions 会保留当时已输出的日志。
    timeout-minutes: 10

    steps:
    # 步骤 1：拉取仓库代码。
    - name: Checkout Code
      uses: actions/checkout@v6

    # 步骤 2：准备 JDK 17。
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    # 步骤 3.1：显式固定 Node 22，并缓存 WebUI 依赖，避免前端构建依赖 runner 预装版本。
    - name: Set up Node.js 22
      uses: actions/setup-node@v6
      with:
        node-version-file: 'webui-frontend/.node-version'
        cache: 'npm'
        cache-dependency-path: webui-frontend/package-lock.json

    # 在任何构建工具启动前校验实际 Node 版本，拒绝缓存中未修复的运行时。
    - name: Verify Node.js security baseline
      run: node webui-frontend/scripts/check-node-version.mjs

    # 步骤 4：初始化 Gradle 环境。
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6

    # 步骤 5：先采集环境信息。
    - name: Environment Diagnostics
      id: environment_diagnostics
      run: |
        # tee 只负责保存日志，工具链探测失败必须让当前步骤失败并阻断后续构建。
        set -o pipefail
        chmod +x gradlew
        mkdir -p diagnostics/ci
        {
          echo "date=$(date --iso-8601=seconds)"
          echo "runner_os=$RUNNER_OS"
          echo "runner_arch=$RUNNER_ARCH"
          echo "github_ref=$GITHUB_REF"
          echo "github_sha=$GITHUB_SHA"
          echo ""
          echo "## java -version"
          java -version
          echo ""
          echo "## gradle --version"
          ./gradlew --version
          echo ""
          echo "## node -v"
          node -v
          echo ""
          echo "## npm -v"
          npm -v
          echo ""
          echo "## uname -a"
          uname -a
          echo ""
          echo "## df -h"
          df -h
          echo ""
          echo "## free -h"
          free -h || true
        } 2>&1 | tee diagnostics/ci/environment.log
    # 步骤 6：先把 WebUI 前端的 lint 和单测跑完，确保新的独立模块在 CI 里被直接验证。
    - name: Check WebUI Frontend
      working-directory: webui-frontend
      run: |
        npm ci
        npm run lint
        npm test

    # 步骤 7：执行编译。
    - name: Compile with Gradle
      id: gradle_compile
      run: |
        set -o pipefail
        ./gradlew compileKotlin compileTestKotlin --stacktrace --info --warning-mode all 2>&1 | tee diagnostics/ci/compile.log

    # 步骤 8：执行测试。
    - name: Test with Gradle
      id: gradle_test
      run: |
        set -o pipefail
        ./gradlew test --stacktrace --info --warning-mode all 2>&1 | tee diagnostics/ci/test.log

    # 步骤 9：执行 shadowJar，确保 CI 产物就是 Docker 和裸机发行链路实际消费的 fat jar。
    - name: Package with Gradle
      id: gradle_package
      run: |
        set -o pipefail
        ./gradlew shadowJar --stacktrace --info --warning-mode all 2>&1 | tee diagnostics/ci/package.log

    # 步骤 10：构建测试包，验证不依赖 jlink runtime 的测试交付链路。
    - name: Build Test Package
      id: gradle_test_package
      run: |
        set -o pipefail
        ./gradlew testPackage --stacktrace --info --warning-mode all 2>&1 | tee diagnostics/ci/test-package.log

    # 步骤 11：发布构建摘要。
    - name: Publish CI Summary
      if: always()
      run: |
        {
          echo "## CI Build and Check"
          echo ""
          echo "- Event: $GITHUB_EVENT_NAME"
          echo "- Ref: $GITHUB_REF"
          echo "- SHA: $GITHUB_SHA"
          echo "- Environment step: ${{ steps.environment_diagnostics.outcome }}"
          echo "- Compile step: ${{ steps.gradle_compile.outcome }}"
          echo "- Test step: ${{ steps.gradle_test.outcome }}"
          echo "- Package step: ${{ steps.gradle_package.outcome }}"
          echo "- Test package step: ${{ steps.gradle_test_package.outcome }}"
          echo ""
          echo "### Diagnostic files"
          find diagnostics/ci build/reports build/test-results -type f 2>/dev/null | sed 's#^#- #'
        } >> "$GITHUB_STEP_SUMMARY"
    # 步骤 12：上传诊断文件。
    - name: Upload CI Diagnostics
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: ci-diagnostics
        path: |
          diagnostics/ci/**
          build/reports/**
          build/test-results/**
          build/tmp/**
        retention-days: 7
        if-no-files-found: warn
    # 步骤 13：仅在成功时上传构建产物。
    - name: Upload Build Artifact
      if: success()
      uses: actions/upload-artifact@v7
      with:
        name: hoshimi-cat-bot-artifacts.zip
        path: build/libs/*.jar
        retention-days: 7
    # 步骤 14：上传测试包，便于在不安装 jlink 的机器上直接验证交付链路。
    - name: Upload Test Package
      if: success()
      uses: actions/upload-artifact@v7
      with:
        name: hoshimi-cat-bot-test-package
        path: build/distributions/*test*
        retention-days: 7
