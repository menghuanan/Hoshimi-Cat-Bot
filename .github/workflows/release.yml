# 本文件主要工作流程：
# 1. 在版本标签推送时启动发布流程。
# 2. 先执行统一编译与测试，阻断不合格构建。
# 3. 在 Windows/Linux 原生 runner 分别打包内置 JRE 的发行包。
# 4. 构建并推送 Docker 镜像，然后聚合发布 GitHub Release。
name: Build and Release on Tag

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  IMAGE_NAME: menghuanan/dynamic-bot

jobs:
  verify:
    runs-on: ubuntu-latest
    # 超过 10 分钟自动终止任务；GitHub Actions 会保留当时已输出的日志。
    timeout-minutes: 10
    outputs:
      release_version: ${{ steps.release_meta.outputs.release_version }}
      is_prerelease: ${{ steps.release_meta.outputs.is_prerelease }}
      make_latest: ${{ steps.release_meta.outputs.make_latest }}
      docker_tags: ${{ steps.release_meta.outputs.docker_tags }}

    steps:
      # 步骤 1：拉取仓库代码。
      - name: Checkout Code
        uses: actions/checkout@v4

      # 步骤 2：校验 Gradle Wrapper。
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      # 步骤 3：准备 JDK 17。
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      # 步骤 3.1：显式固定 Node 22，并缓存 WebUI 依赖，保证 release 阶段的前端构建稳定可复现。
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webui-frontend/package-lock.json

      # 步骤 4：初始化 Gradle 环境。
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 步骤 5：授予 gradlew 可执行权限。
      - name: Enable Gradle Wrapper
        run: chmod +x gradlew

      # 步骤 6：提取版本与发布通道元数据，供后续 job 统一复用。
      - name: Resolve Release Metadata
        id: release_meta
        shell: bash
        run: |
          release_tag="${GITHUB_REF_NAME}"
          release_version="${release_tag#v}"
          echo "release_version=${release_version}" >> "${GITHUB_OUTPUT}"

          # 带连字符后缀的版本视为预发布，例如 v1.8.5-beta。
          if [[ "${release_tag}" == *-* ]]; then
            echo "is_prerelease=true" >> "${GITHUB_OUTPUT}"
            echo "make_latest=false" >> "${GITHUB_OUTPUT}"
          else
            echo "is_prerelease=false" >> "${GITHUB_OUTPUT}"
            echo "make_latest=true" >> "${GITHUB_OUTPUT}"
          fi

          # Docker 始终推送完整标签，latest 仅保留给正式版。
          {
            echo "docker_tags<<EOF"
            echo "type=raw,value=${{ github.ref_name }}"
            if [[ "${release_tag}" != *-* ]]; then
              echo "type=raw,value=latest"
            fi
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      # 步骤 7：先执行编译并输出详细日志，避免发布构建阶段静默卡住。
      - name: Compile with Gradle
        run: |
          set -o pipefail
          mkdir -p diagnostics/release
          ./gradlew compileKotlin compileTestKotlin -PreleaseVersion="${{ steps.release_meta.outputs.release_version }}" --stacktrace --info --warning-mode all 2>&1 | tee diagnostics/release/compile.log

      # 步骤 8：执行测试并持续输出日志，便于定位 test 阶段问题。
      - name: Test with Gradle
        run: |
          set -o pipefail
          ./gradlew test -PreleaseVersion="${{ steps.release_meta.outputs.release_version }}" --stacktrace --info --warning-mode all 2>&1 | tee diagnostics/release/test.log

      # 步骤 9：在 release 校验阶段提前产出 shadowJar，确保后续 Docker job 拿到的就是同一份 WebUI+后端产物。
      - name: Build Shadow Jar
        run: |
          set -o pipefail
          ./gradlew shadowJar -PreleaseVersion="${{ steps.release_meta.outputs.release_version }}" --stacktrace --info --warning-mode all 2>&1 | tee diagnostics/release/shadowjar.log

      # 步骤 10：上传 shadowJar，供 Docker job 直接复用，避免 Dockerfile 依赖未生成的本地构建产物。
      - name: Upload Shadow Jar Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-shadow-jar
          path: build/libs/dynamic-bot-${{ steps.release_meta.outputs.release_version }}.jar
          if-no-files-found: error
          retention-days: 7

      # 步骤 11：上传构建诊断文件，失败时也保留证据。
      - name: Upload Verify Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-verify-diagnostics
          path: |
            diagnostics/release/**
            build/reports/**
            build/test-results/**
            build/tmp/**
          retention-days: 7
          if-no-files-found: warn

  package_windows:
    runs-on: windows-latest
    needs: verify
    # Windows runner 需要额外时间创建 jlink 运行时镜像。
    timeout-minutes: 15

    steps:
      # 步骤 1：拉取仓库代码。
      - name: Checkout Code
        uses: actions/checkout@v4

      # 步骤 2：校验 Gradle Wrapper。
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      # 步骤 3：准备 JDK 17。
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      # 步骤 3.1：固定 Node 22，确保 Windows 打包时 WebUI 前端依赖的构建环境一致。
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webui-frontend/package-lock.json

      # 步骤 4：初始化 Gradle 环境。
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 步骤 5：构建 Windows 发行包（内置 jlink 精简 JRE）。
      - name: Package Windows Release
        run: |
          New-Item -ItemType Directory -Force -Path diagnostics/release | Out-Null
          .\gradlew.bat windowsReleaseDistZip -PreleaseVersion="${{ needs.verify.outputs.release_version }}" --stacktrace --info --warning-mode all 2>&1 | Tee-Object -FilePath diagnostics/release/package-windows.log

      # 步骤 6：上传 Windows 构建诊断文件。
      - name: Upload Windows Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-diagnostics
          path: |
            diagnostics/release/**
            build/reports/**
            build/test-results/**
            build/tmp/**
          retention-days: 7
          if-no-files-found: warn

      # 步骤 7：上传 Windows 发布资产供最终 release job 聚合。
      - name: Upload Windows Release Asset
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-dist
          path: build/distributions/dynamic-bot-windows-x64-v${{ needs.verify.outputs.release_version }}.zip
          if-no-files-found: error
          retention-days: 7

  package_linux:
    runs-on: ubuntu-latest
    needs: verify
    # Linux runner 需要额外时间创建 jlink 运行时镜像。
    timeout-minutes: 15

    steps:
      # 步骤 1：拉取仓库代码。
      - name: Checkout Code
        uses: actions/checkout@v4

      # 步骤 2：校验 Gradle Wrapper。
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      # 步骤 3：准备 JDK 17。
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      # 步骤 3.1：固定 Node 22，确保 Linux 发行包中的 WebUI 前端构建环境一致。
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webui-frontend/package-lock.json

      # 步骤 4：初始化 Gradle 环境。
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 步骤 5：授予 gradlew 可执行权限。
      - name: Enable Gradle Wrapper
        run: chmod +x gradlew

      # 步骤 6：构建 Linux 发行包（内置 jlink 精简 JRE）。
      - name: Package Linux Release
        run: |
          set -o pipefail
          mkdir -p diagnostics/release
          ./gradlew linuxReleaseDistTar -PreleaseVersion="${{ needs.verify.outputs.release_version }}" --stacktrace --info --warning-mode all 2>&1 | tee diagnostics/release/package-linux.log

      # 步骤 7：上传 Linux 构建诊断文件。
      - name: Upload Linux Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-diagnostics
          path: |
            diagnostics/release/**
            build/reports/**
            build/test-results/**
            build/tmp/**
          retention-days: 7
          if-no-files-found: warn

      # 步骤 8：上传 Linux 发布资产供最终 release job 聚合。
      - name: Upload Linux Release Asset
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-dist
          path: build/distributions/dynamic-bot-linux-x64-v${{ needs.verify.outputs.release_version }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    needs: verify
    # Docker 构建和推送可能受到镜像层上传时延影响。
    timeout-minutes: 15

    steps:
      # 步骤 1：拉取仓库代码。
      - name: Checkout Code
        uses: actions/checkout@v4

      # 步骤 2：下载 verify job 产出的 shadowJar，供 Dockerfile 的 COPY 指令直接使用。
      - name: Download Shadow Jar Artifact
        uses: actions/download-artifact@v4
        with:
          name: release-shadow-jar
          path: build/libs

      # 步骤 3：初始化 Docker Buildx。
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 步骤 4：登录 Docker Hub。
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 步骤 5：生成镜像元数据。
      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: ${{ needs.verify.outputs.docker_tags }}

      # 步骤 6：构建并推送镜像。
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ needs.verify.outputs.release_version }}

  release:
    runs-on: ubuntu-latest
    needs: [verify, package_windows, package_linux, docker]
    # 聚合资产并创建 release 过程包含 artifact 下载与文件校验。
    timeout-minutes: 10

    steps:
      # 步骤 1：拉取仓库代码以读取可选自定义发布说明。
      - name: Checkout Code
        uses: actions/checkout@v4

      # 步骤 2：下载 Windows 发布资产。
      - name: Download Windows Release Asset
        uses: actions/download-artifact@v4
        with:
          name: windows-release-dist
          path: build/distributions

      # 步骤 3：下载 Linux 发布资产。
      - name: Download Linux Release Asset
        uses: actions/download-artifact@v4
        with:
          name: linux-release-dist
          path: build/distributions

      # 步骤 4：先解析发布说明文件。
      - name: Resolve Release Body
        id: release_body
        shell: bash
        run: |
          release_body_path="docs/release/release-${GITHUB_REF_NAME}.md"
          if [[ -f "${release_body_path}" ]]; then
            echo "has_custom_body=true" >> "${GITHUB_OUTPUT}"
            echo "body_path=${release_body_path}" >> "${GITHUB_OUTPUT}"
          else
            echo "has_custom_body=false" >> "${GITHUB_OUTPUT}"
          fi

      # 步骤 5：存在自定义说明时优先创建带定制文案的 Release。
      - name: Create Release with Custom Notes
        if: steps.release_body.outputs.has_custom_body == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          prerelease: ${{ needs.verify.outputs.is_prerelease }}
          make_latest: ${{ needs.verify.outputs.make_latest }}
          body_path: ${{ steps.release_body.outputs.body_path }}
          files: |
            build/distributions/dynamic-bot-windows-x64-v${{ needs.verify.outputs.release_version }}.zip
            build/distributions/dynamic-bot-linux-x64-v${{ needs.verify.outputs.release_version }}.tar.gz

      # 步骤 6：缺少自定义说明时回退自动生成说明。
      - name: Create Release with Generated Notes
        if: steps.release_body.outputs.has_custom_body != 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          prerelease: ${{ needs.verify.outputs.is_prerelease }}
          make_latest: ${{ needs.verify.outputs.make_latest }}
          generate_release_notes: true
          files: |
            build/distributions/dynamic-bot-windows-x64-v${{ needs.verify.outputs.release_version }}.zip
            build/distributions/dynamic-bot-linux-x64-v${{ needs.verify.outputs.release_version }}.tar.gz
